<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Struk Pengiriman</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="back" id="btnTopBack" type="button" aria-label="Kembali" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="logo">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
  </div>
  <h1 id="ttl">Formulir Pengiriman</h1>
  <p id="sub">Isi data pengirim dan penerima</p>
</header>

<main class="sheet">
  <!-- ===== TAB FORMULIR ===== -->
  <section class="view active" id="view-form">
    <form id="form" novalidate autocomplete="off">
      <div class="group">
        <h2><span class="dot">1</span> Data Pengirim</h2>
        <div class="field"><label for="pNama">Nama</label>
          <input id="pNama" name="pNama" autocapitalize="words" enterkeyhint="next" placeholder="Nama pengirim" required>
          <em class="err" data-for="pNama"></em></div>
        <div class="field"><label for="pHp">Nomor HP</label>
          <input id="pHp" name="pHp" type="tel" enterkeyhint="next" inputmode="tel" placeholder="08xxxxxxxxxx" required>
          <em class="err" data-for="pHp"></em></div>
        <div class="addr-block" data-prefix="p"></div>
      </div>

      <div class="group">
        <h2><span class="dot">2</span> Data Penerima</h2>
        <div class="field"><label for="rNama">Nama</label>
          <input id="rNama" name="rNama" autocapitalize="words" enterkeyhint="next" placeholder="Nama penerima" required>
          <em class="err" data-for="rNama"></em></div>
        <div class="field"><label for="rHp">Nomor HP</label>
          <input id="rHp" name="rHp" type="tel" enterkeyhint="next" inputmode="tel" placeholder="08xxxxxxxxxx" required>
          <em class="err" data-for="rHp"></em></div>
        <div class="addr-block" data-prefix="r"></div>
      </div>

      <div class="sticky"><button class="btn primary" type="submit">Buat Struk</button></div>
      <div class="or"><span>atau</span></div>
      <button class="btn ghost" type="button" id="btnReset">Kosongkan Formulir</button>
    </form>
  </section>

  <!-- ===== TAB STRUK ===== -->
  <section class="view" id="view-struk">
    <div class="empty" id="empty">Belum ada struk. Isi formulir lalu tekan <b>Buat Struk</b>.</div>
    <div id="receipt" class="receipt" hidden></div>
    <div class="actions" id="actions" hidden>
      <button class="btn primary" id="btnPrint" type="button">Cetak / Simpan PDF</button>
      <button class="btn ghost" id="btnBack" type="button">Ubah Data</button>
    </div>
  </section>
</main>

<nav class="bottomnav">
  <button class="active" data-view="form"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></span>Formulir</button>
  <button data-view="struk"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>Struk</button>
</nav>
<div id="toast" class="toast"></div>

<script src="js/script.js"></script>
</body>
</html>
